name: Security Checks

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Block merge: required status check on PRs.
# Configure branch protection on GitHub to require "security / audit" to pass.
jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 1) Dependency vulnerabilities — fail on HIGH or CRITICAL
      - name: npm audit (high+critical)
        run: |
          set +e
          bunx --bun npm audit --omit=dev --audit-level=high --json > audit.json
          STATUS=$?
          HIGH=$(node -e "const a=require('./audit.json');const m=a.metadata?.vulnerabilities||{};console.log((m.high||0)+(m.critical||0))")
          echo "High/Critical vulnerabilities: $HIGH"
          if [ "$HIGH" -gt 0 ]; then
            echo "::error::Found $HIGH high/critical dependency vulnerabilities. Blocking merge."
            node -e "const a=require('./audit.json');for(const[k,v]of Object.entries(a.vulnerabilities||{})){if(['high','critical'].includes(v.severity))console.log('-',k,v.severity,v.via?.[0]?.url||'')}"
            exit 1
          fi
          exit 0

      # 2) Secret scanning — fail if leaked credentials are found
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3) Static analysis on JS/TS — fail on high severity
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          upload: true
        # Fail the job when CodeQL detects new high/critical alerts on the PR.
        env:
          CODEQL_ACTION_EXTRA_OPTIONS: '{"database":{"finalize":["--no-cleanup"]}}'

      # 4) Supabase advisor (optional — runs only when secrets are configured).
      #    Set SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF in repo secrets to enable.
      - name: Supabase security advisor
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -e
          curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/advisors?type=security" \
            -o advisors.json
          ERRORS=$(node -e "const a=require('./advisors.json');const l=(a.lints||a||[]).filter(x=>['ERROR','HIGH','CRITICAL'].includes((x.level||x.severity||'').toUpperCase()));console.log(l.length);process.stdout.write(JSON.stringify(l,null,2))" | head -1)
          if [ "${ERRORS:-0}" -gt 0 ]; then
            echo "::error::Supabase advisor reported $ERRORS high-severity issues. Blocking merge."
            cat advisors.json
            exit 1
          fi