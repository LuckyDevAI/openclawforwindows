appId: com.openclaw.forwindows
productName: OpenClawForWindows
directories:
  output: /tmp/electron-installer
  buildResources: public
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!node_modules/**/*"
extraMetadata:
  main: electron/main.cjs
win:
  target:
    - target: nsis
      arch: x64
  icon: public/favicon.ico
  artifactName: OpenClawForWindows-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OpenClawForWindows
  runAfterFinish: true
  differentialPackage: false
  unicode: true
